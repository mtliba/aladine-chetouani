# Thèmes de recherche — modifiable dans le CMS (Pages > Recherche)
intro_fr: ""
intro_en: ""
themes:
  - code: GAZE
    title_fr: Attention visuelle et oculométrie
    title_en: Visual attention and eye tracking
    text_fr: Prédire où se pose le regard (saillance, parcours oculaires) sur des images, des vidéos et des œuvres d'art.
    text_en: Predicting where people look (saliency, scanpaths) on images, video and artworks.
    keywords:
      - Saliency
      - Scanpaths
      - Eye tracking
      - ETRA
  - code: IQA
    title_fr: Évaluation de la qualité perçue
    title_en: Perceptual quality assessment
    text_fr: Mesurer automatiquement la qualité perçue des images, vidéos, maillages 3D et nuages de points.
    text_en: Measuring the perceived quality of images, video, 3D meshes and point clouds automatically.
    keywords:
      - No-reference IQA
      - Point clouds
      - 3D meshes
      - Stereo
  - code: MED
    title_fr: Imagerie médicale
    title_en: Medical imaging
    text_fr: Détection précoce de la gonarthrose sur radiographies.
    text_en: Early detection of knee osteoarthritis on X-rays.
    keywords:
      - Knee osteoarthritis
      - X-ray
      - Explainability
  - code: HERITAGE
    title_fr: Patrimoine culturel et art
    title_en: Cultural heritage and art
    text_fr: Analyse d'images pour le patrimoine et étude du regard porté sur les œuvres d'art.
    text_en: Image analysis for heritage, and how people look at artworks.
    keywords:
      - Pottery sherds
      - Paintings
      - Art perception
  - code: HUMAN
    title_fr: Expressions faciales et comportement humain
    title_en: Facial expressions and human behaviour
    text_fr: Expressions faciales et comportement humain.
    text_en: Facial expressions and human behaviour.
    keywords:
      - Facial expressions
      - Anti-spoofing
      - Behaviour
