# Parcours — modifiable dans le CMS (Pages > Biographie et parcours)
bio_fr: |-
  Aladine Chetouani est professeur des universités à l'Université Sorbonne Paris Nord, où il dirige l'équipe Multimédia du laboratoire L2TI.

  Ses recherches portent sur la perception visuelle : où se pose notre regard, comment nous jugeons la qualité d'une image, et comment l'apprentissage profond peut le prédire. Elles trouvent des applications en imagerie médicale et pour le patrimoine culturel.
bio_en: |-
  Aladine Chetouani is a Full Professor at Université Sorbonne Paris Nord, where he heads the Multimedia team of the L2TI laboratory.

  His research is about visual perception: where people look, how they judge the quality of what they see, and how deep learning can predict both. It has applications in medical imaging and cultural heritage.
