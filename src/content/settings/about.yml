# Parcours — modifiable dans le CMS (Pages > Biographie et parcours)
bio_fr: |-
  Il est professeur des universités à l'Université Sorbonne Paris Nord, où il dirige l'équipe Multimédia du laboratoire L2TI et le parcours Images du master 2 « Ingénierie et Innovation en Images et Réseaux » (3IR).

  Ses recherches portent sur des modèles de perception visuelle fondés sur l'apprentissage : attention visuelle, qualité perçue, expressions faciales et comportement humain, pour les images, la stéréo, la vidéo, les maillages 3D et les nuages de points, avec des applications en imagerie médicale et pour le patrimoine culturel. Il a publié 28 articles de revues et plus de 150 communications, et encadré douze doctorants.

  Il a été président général d'ACM ETRA 2025 et 2026 ; il préside le comité Challenges & Data Collection de l'IEEE Signal Processing Society et est éditeur associé d'IEEE Transactions on Multimedia.
bio_en: |-
  He is a Full Professor at Université Sorbonne Paris Nord, where he heads the Multimedia team of the L2TI laboratory and the Images track of the MSc 2 “Engineering and Innovation in Images and Networks” (3IR).

  His research develops learning-based models of visual perception — visual attention, perceived quality, facial expressions and human behaviour — for images, stereo, video, 3D meshes and point clouds, with applications in medical imaging and cultural heritage. He has published 28 journal articles and more than 150 conference papers, and supervised twelve PhD students.

  He was General Chair of ACM ETRA 2025 and 2026, chairs the IEEE Signal Processing Society Challenges & Data Collection committee, and is an Associate Editor of IEEE Transactions on Multimedia.
