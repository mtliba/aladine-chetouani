committees_fr:
  - 'IEEE SPS : président du comité Challenges & Data Collection (2025–) ; membre des comités techniques MMSP, IVMSP et CDC'
  - 'Comités de pilotage : IEEE IPTA (webmestre depuis 2016), CBMI (depuis 2023)'
  - 'Area Chair : ICIP, ICASSP, ICME, QoMEX, EUSIPCO, ACM IMX'
  - 'Comités de programme : ACM Multimedia, ICPR et d''autres'
  - '9 sessions spéciales (ICIP 2018, 2021, 2022 ; ICME 2020 ; IPTA 2015, 2019 ; GRETSI 2019 ; EUVIP 2018) et l''atelier ACM IMX « Visual Attention in Multimedia Experience »'
  - '8 conférences invitées, dont CIC 2019, IEEE EUVIP 2016, NTNU Colourlab, Cardiff University, Université Mohammed Premier'
committees_en:
  - 'IEEE SPS: Chair of the Challenges & Data Collection Committee (2025–); member of the MMSP, IVMSP and CDC Technical Committees'
  - 'Steering committees: IEEE IPTA (webmaster since 2016), CBMI (since 2023)'
  - 'Area Chair: ICIP, ICASSP, ICME, QoMEX, EUSIPCO, ACM IMX'
  - 'Programme committees: ACM Multimedia, ICPR and others'
  - '9 special sessions (ICIP 2018, 2021, 2022; ICME 2020; IPTA 2015, 2019; GRETSI 2019; EUVIP 2018) and the ACM IMX workshop “Visual Attention in Multimedia Experience”'
  - '8 invited talks, incl. CIC 2019, IEEE EUVIP 2016, NTNU Colourlab, Cardiff University, Université Mohammed Premier'
